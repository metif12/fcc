name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      V_MACOS_V3_NO_FALLBACK: '1'
      VJOBS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch V toolchain
        # Pinned to the commit this repo builds with (see `v version` locally).
        # `latest` moves under CI and newer compilers reject patterns this tree
        # relies on, which is a toolchain difference, not a code defect — the
        # day the tree moves to a newer V, this pin moves with it.
        shell: powershell
        run: |
          git clone https://github.com/vlang/v.git "$env:RUNNER_TEMP\vhome"
          cd "$env:RUNNER_TEMP\vhome"
          git checkout weekly.2026.41
          # `make.bat` does not exist at this tag; the Windows entry point is
          # `makev.bat` (it became `make.bat` again later — do not "fix" this
          # to `make.bat` without checking the tag first). `-gcc` avoids the
          # bundled tcc, which cannot link V's own runtime in this environment.
          & "$env:RUNNER_TEMP\vhome\makev.bat" -gcc
          "V=$env:RUNNER_TEMP\vhome" | Out-File -FilePath $env:GITHUB_PATH -Append
          cd "$env:GITHUB_WORKSPACE"

      - name: Fetch vlang/v for the tcc oracle headers
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/vlang/v.git "$env:RUNNER_TEMP\vlang-v"
          "VCC_V_ROOT=$env:RUNNER_TEMP\vlang-v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: powershell
        run: |
          $env:PATH = "$env:RUNNER_TEMP\vhome;" + $env:PATH
          $env:TMPDIR = "$env:RUNNER_TEMP\vccbuild"
          New-Item -ItemType Directory -Path $env:TMPDIR -Force | Out-Null
          v -o fcc.exe .

      - name: Unit tests
        shell: powershell
        run: |
          $env:PATH = "$env:RUNNER_TEMP\vhome;" + $env:PATH
          $env:TMPDIR = "$env:RUNNER_TEMP\vccbuild"
          v test .
