name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      V_MACOS_V3_NO_FALLBACK: '1'
      VJOBS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch V toolchain
        # `latest` prebuilt. Newer V rejects patterns this tree used
        # (bare match tails, `else` on exhaustive match, or-unwrap with
        # value, loop-only returns, mut-from-immutable); those are fixed in
        # the tree rather than worked around here.
        shell: powershell
        run: |
          $url = 'https://github.com/vlang/v/releases/latest/download/v_windows.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\v.zip"
          Expand-Archive -DestinationPath "$env:RUNNER_TEMP\vhome" -Path "$env:RUNNER_TEMP\v.zip"
          "V=$env:RUNNER_TEMP\vhome\v" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Fetch vlang/v for the tcc oracle headers
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/vlang/v.git "$env:RUNNER_TEMP\vlang-v"
          "VCC_V_ROOT=$env:RUNNER_TEMP\vlang-v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: powershell
        run: |
          $env:PATH = "$env:RUNNER_TEMP\vhome;" + $env:PATH
          $env:TMPDIR = "$env:RUNNER_TEMP\vccbuild"
          New-Item -ItemType Directory -Path $env:TMPDIR -Force | Out-Null
          v -o fcc.exe .

      - name: Unit tests
        shell: powershell
        run: |
          $env:PATH = "$env:RUNNER_TEMP\vhome;" + $env:PATH
          $env:TMPDIR = "$env:RUNNER_TEMP\vccbuild"
          v test .
