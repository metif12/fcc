name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      V_MACOS_V3_NO_FALLBACK: '1'
      VJOBS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch V toolchain
        # GITHUB_PATH takes bare paths. Writing `V=<path>` there adds an entry
        # literally named "V=<path>", so the directory never reaches PATH and the
        # next step fails with "v is not recognized" rather than a compile error.
        # The archive's internal layout has changed before, so the executable is
        # located rather than assumed, and a missing one is an error.
        shell: powershell
        run: |
          $url = 'https://github.com/vlang/v/releases/latest/download/v_windows.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\v.zip"
          Expand-Archive -DestinationPath "$env:RUNNER_TEMP\vhome" -Path "$env:RUNNER_TEMP\v.zip"
          $v = Get-ChildItem -Path "$env:RUNNER_TEMP\vhome" -Filter 'v.exe' -Recurse | Select-Object -First 1
          if (-not $v) { throw 'v.exe not found in the extracted V archive' }
          $v.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append
          & $v.FullName version

      - name: Fetch vlang/v for the tcc oracle headers
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/vlang/v.git "$env:RUNNER_TEMP\vlang-v"
          "VCC_V_ROOT=$env:RUNNER_TEMP\vlang-v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: powershell
        run: |
          $env:PATH = "$env:RUNNER_TEMP\vhome;" + $env:PATH
          $env:TMPDIR = "$env:RUNNER_TEMP\vccbuild"
          New-Item -ItemType Directory -Path $env:TMPDIR -Force | Out-Null
          v -o fcc.exe .

      - name: Unit tests
        shell: powershell
        run: |
          $env:PATH = "$env:RUNNER_TEMP\vhome;" + $env:PATH
          $env:TMPDIR = "$env:RUNNER_TEMP\vccbuild"
          v test .
